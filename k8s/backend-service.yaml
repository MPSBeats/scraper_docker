apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: restaurant-api
  labels:
    app: backend
spec:
  type: ClusterIP  # Accessible uniquement depuis l'intérieur du cluster
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: backend
