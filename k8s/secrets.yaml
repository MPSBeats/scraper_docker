apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: restaurant-api
type: Opaque
data:
  # IMPORTANT: Ces valeurs sont encodées en base64
  # Pour encoder: echo -n "votre-valeur" | base64
  # Pour décoder: echo "valeur-base64" | base64 -d
  
  # JWT Secret (changez en production!)
  # Valeur actuelle: "supersecret_jwt_key_changez_en_production"
  JWT_SECRET: c3VwZXJzZWNyZXRfand0X2tleV9jaGFuZ2V6X2VuX3Byb2R1Y3Rpb24=
  
  # PostgreSQL Credentials
  # Valeur actuelle user: "postgres"
  POSTGRES_USER: cG9zdGdyZXM=
  # Valeur actuelle password: "password"
  POSTGRES_PASSWORD: cGFzc3dvcmQ=

---
# Note: Pour créer le secret avec vos propres valeurs, utilisez:
# kubectl create secret generic app-secrets \
#   --from-literal=JWT_SECRET=votre_jwt_secret \
#   --from-literal=POSTGRES_USER=postgres \
#   --from-literal=POSTGRES_PASSWORD=votre_password \
#   -n restaurant-api
