services:
  # Service Backend (API)
  backend:
    build: .
    container_name: orium_backend
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      - PORT=${PORT:-3000}
      - DATABASE_URL=${DATABASE_URL}
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOW_ALL=${CORS_ALLOW_ALL:-false}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - app-network

  # Service Frontend
  client:
    build: ./client
    container_name: orium_client
    ports:
      - "8080:80" # Accessible sur http://localhost:8080
    depends_on:
      - backend
    networks:
      - app-network

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: orium_postgres
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./structure-bdd/bdd_sql.sql:/docker-entrypoint-initdb.d/init.sql # Import des données
    networks:
      - app-network
    # Ports removed for security (only internal access)
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB
  mongo:
    image: mongo:6-jammy
    container_name: orium_mongo
    volumes:
      - mongo_data:/data/db
      - ./structure-bdd/restaurants_clean (1).json:/data/restaurants.json # Import des données
      - ./structure-bdd/mongo-init.sh:/docker-entrypoint-initdb.d/init-mongo.sh # Script d'initialisation
    networks:
      - app-network
    # Ports removed for security (only internal access)
    # ports:
    #   - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

# Réseaux
networks:
  app-network:
    driver: bridge

# Volumes
volumes:
  postgres_data:
  mongo_data:
