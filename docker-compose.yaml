version: '3.8'

services:
  # Service Backend (API)
  backend:
    build: .
    container_name: orium_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/orium_agence_scrapper_sql
      - MONGO_URI=mongodb://mongo:27017/orium_agence_scrapper_nosql
      - JWT_SECRET=xxx
      - CORS_ALLOW_ALL=true
    depends_on:
      - postgres
      - mongo
    networks:
      - app-network

  # Service Frontend
  client:
    build: ./client
    container_name: orium_client
    ports:
      - "8080:80" # Accessible sur http://localhost:8080
    depends_on:
      - backend
    networks:
      - app-network

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: orium_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=orium_agence_scrapper_sql
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./structure-bdd/bdd_sql.sql:/docker-entrypoint-initdb.d/init.sql # Import des données
    networks:
      - app-network
    ports:
      - "5432:5432"

  # MongoDB
  mongo:
    image: mongo:6-jammy
    container_name: orium_mongo
    volumes:
      - mongo_data:/data/db
      - ./structure-bdd/restaurants_clean (1).json:/data/restaurants.json # Import des données
      - ./structure-bdd/mongo-init.sh:/docker-entrypoint-initdb.d/init-mongo.sh # Script d'initialisation
    networks:
      - app-network
    ports:
      - "27017:27017"

# Réseaux
networks:
  app-network:
    driver: bridge

# Volumes
volumes:
  postgres_data:
  mongo_data: